<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pour Mouna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FBF6F2;
    --plum: #3D1F2B;
    --plum-soft: #6B4655;
    --rose: #B8556F;
    --gold: #C9A24B;
    --line: rgba(61, 31, 43, 0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ivory);
    color: var(--plum);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 3rem 2.2rem;
    text-align: center;
    box-shadow: 0 24px 60px rgba(61, 31, 43, 0.08);
  }

  .card h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 2.2rem;
    margin: 0 0 0.3rem;
  }
  .card .sub {
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.03em;
    margin: 0 0 2.2rem;
  }

  .compliment {
    min-height: 4.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .compliment p {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.5;
    color: var(--plum);
    margin: 0;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .compliment p.show {
    opacity: 1;
    transform: translateY(0);
  }

  .btn {
    margin-top: 2.4rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--plum);
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.85rem 1.9rem;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .btn:hover {
    border-color: var(--rose);
    background: #fff;
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }

  :focus-visible {
    outline: 2px solid var(--rose);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .compliment p { transition: none; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Mouna</h1>
  <p class="sub">quelques vérités sur toi</p>

  <div class="compliment">
    <p id="text" class="show"></p>
  </div>

  <button class="btn" id="next">un autre</button>
</div>

<script>
  var compliments = [
    "Tu es belle, d'une beauté qui n'a pas besoin d'être cherchée.",
    "Ta présence rend les choses plus douces.",
    "Tu as un cœur rare — sincère, sans calcul.",
    "Ton rire est contagieux, même à travers un écran.",
    "Tu es plus forte que tu ne le crois.",
    "Il y a une élégance naturelle dans tout ce que tu fais.",
    "Tu écoutes vraiment les gens, et ça se voit.",
    "Tu illumines une pièce sans même essayer.",
    "Tu mérites tout ce qu'il y a de bon.",
    "Il n'y a qu'une seule Mouna, et c'est ta plus grande force."
  ];

  var el = document.getElementById('text');
  var btn = document.getElementById('next');
  var used = [];

  function pick() {
    if (used.length === compliments.length) used = [];
    var idx;
    do { idx = Math.floor(Math.random() * compliments.length); }
    while (used.indexOf(idx) !== -1);
    used.push(idx);
    return compliments[idx];
  }

  function show(text) {
    el.classList.remove('show');
    setTimeout(function() {
      el.textContent = text;
      el.classList.add('show');
    }, 200);
  }

  show(pick());
  btn.addEventListener('click', function() { show(pick()); });
</script>

</body>
</html>
